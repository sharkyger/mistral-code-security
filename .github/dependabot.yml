version: 2
# Added 2026-08-29. This repo had NO dependabot.yml, so no VERSION updates ran —
# only security updates, which fire from repo settings without a config.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-deps:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
